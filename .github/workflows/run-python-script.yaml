# This workflow will install Python dependencies and run the script
#
# The data comes from the "Storm Alert" Databricks job (OCHA-DAP/ds-storms-alerts,
# task hdx_export), which reads the storms database (unreachable from GitHub
# Actions since 2026-09-30) and writes one CSV per storm plus a manifest to the
# DSci dev blob after every NHC advisory: 04:15 / 10:15 / 16:15 / 22:15 UTC
# while NHC runs on its temporary 6-hourly cadence, ~03:50 / 09:50 / 15:50 /
# 21:50 once it reverts. The cron below runs 30 min after the former, which
# is after both. A manifest older than 6 h is skipped (the export missed a
# cycle); dispatch with force to publish it anyway.

name: Run script

on:
  workflow_dispatch: # add run button in github
    inputs:
      force:
        description: "Publish even if the export manifest is more than 6 hours old"
        type: boolean
        default: false
#  schedule:
#    - cron: "45 4,10,16,22 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Run script
        env:
          HDX_SITE: ${{ vars.HDX_SITE }}
          HDX_KEY: ${{ secrets.HDX_BOT_SCRAPERS_API_TOKEN }}
          PREPREFIX: ${{ vars.HDX_USER_AGENT_PREPREFIX }}
          USER_AGENT: ${{ vars.USER_AGENT }}
          EXTRA_PARAMS: ${{ vars.EXTRA_PARAMS }}
          # Read access to the export on the DSci dev blob (OCHA-DAP org secret)
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}

        # 'uv run' executes the command inside the environment created by 'uv sync'
        run: |
          test -n "$DSCI_AZ_BLOB_DEV_SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          uv run --frozen python -m hdx.scraper.storms

      - name: Send mail
        if: failure()
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: ${{secrets.HDX_PIPELINE_EMAIL_SERVER}}
          server_port: ${{secrets.HDX_PIPELINE_EMAIL_PORT}}
          username: ${{secrets.HDX_PIPELINE_EMAIL_USERNAME}}
          password: ${{secrets.HDX_PIPELINE_EMAIL_PASSWORD}}
          subject: "FAILED: ${{github.repository}} run job"
          body: GitHub Actions run job for ${{github.repository}} failed!
          to: ${{vars.HDX_PIPELINE_EMAIL_LIST}}
          from: ${{secrets.HDX_PIPELINE_EMAIL_FROM}}
          content_type: text/html

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
